name: Build APK

on:
  workflow_dispatch:        # GitHub पर "Run workflow" बटन से हाथ से चलाएं
  push:
    tags: ['v*']            # जैसे v1.0.1 टैग बनाने पर अपने-आप बने और Release में रखे

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Prepare files
        run: |
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk AshaManagement.apk
          echo "{\"versionCode\":$VC,\"versionName\":\"$VN\",\"apkUrl\":\"https://github.com/${{ github.repository }}/releases/latest/download/AshaManagement.apk\"}" > version.json
          cat version.json

      - uses: actions/upload-artifact@v4
        with:
          name: AshaManagement-apk
          path: AshaManagement.apk

      - name: Publish release (टैग पर)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AshaManagement.apk
            version.json
